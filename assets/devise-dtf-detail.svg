<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DTF print close-up</title>
  <desc id="desc">Detailed textile illustration showing a crisp heat-transferred print layer on cotton.</desc>
  <defs>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b2d"/><stop offset=".48" stop-color="#101415"/><stop offset="1" stop-color="#303637"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a4"/><stop offset=".42" stop-color="#ffde59"/><stop offset=".78" stop-color="#ffc928"/><stop offset="1" stop-color="#bd8c00"/>
    </linearGradient>
    <pattern id="weave" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M0 3h18M0 12h18" stroke="#fff" stroke-opacity=".065" stroke-width="3"/>
      <path d="M3 0v18M12 0v18" stroke="#000" stroke-opacity=".23" stroke-width="2"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity=".48"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="1" flood-color="#fff" flood-opacity=".28"/>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".52"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#fabric)"/>
  <rect width="1200" height="760" fill="url(#weave)"/>
  <path d="M-20 170C180 85 340 112 490 235s300 164 730 35v470H-20Z" fill="#090c0d" opacity=".34"/>
  <g filter="url(#lift)">
    <path d="M168 520 355 190h136l-65 125h141l63-125h137L576 520H440l69-132H367l-67 132Z" fill="url(#film)"/>
    <circle cx="786" cy="365" r="150" fill="none" stroke="#ffde59" stroke-width="54"/>
    <path d="M882 247 1040 510H910L804 330Z" fill="#fffdf5"/>
  </g>
  <path d="M260 470 437 214h58L348 470Zm354-216 38-64h115L584 520h-58Z" fill="url(#shine)" opacity=".55"/>
  <path d="M690 260a150 150 0 0 1 191-20" fill="none" stroke="#fff" stroke-opacity=".42" stroke-linecap="round" stroke-width="10"/>
  <rect x="36" y="36" width="1128" height="688" rx="30" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
  <g transform="translate(76 596)">
    <rect width="382" height="86" rx="43" fill="#080a0b" fill-opacity=".78"/>
    <circle cx="47" cy="43" r="13" fill="#ffde59"/>
    <text x="80" y="38" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Transfer ovanpå tyget</text>
    <text x="80" y="64" fill="#c9cecf" font-family="Arial, sans-serif" font-size="18">Skarp, lätt blank yta</text>
  </g>
</svg>
