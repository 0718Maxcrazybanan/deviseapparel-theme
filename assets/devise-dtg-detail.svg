<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DTG print close-up</title>
  <desc id="desc">Detailed textile illustration showing ink absorbed into visible cotton fibers.</desc>
  <defs>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252a2b"/><stop offset=".5" stop-color="#111516"/><stop offset="1" stop-color="#2d3334"/>
    </linearGradient>
    <radialGradient id="ink" cx="42%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffe984"/><stop offset=".55" stop-color="#ffde59"/><stop offset="1" stop-color="#d9ad18"/>
    </radialGradient>
    <pattern id="weave" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M0 3h18M0 12h18" stroke="#fff" stroke-opacity=".075" stroke-width="3"/>
      <path d="M3 0v18M12 0v18" stroke="#000" stroke-opacity=".22" stroke-width="2"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .17" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".42" numOctaves="2" seed="4" result="n"/>
      <feComposite in="n" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#fabric)"/>
  <path d="M-20 170C180 85 340 112 490 235s300 164 730 35v470H-20Z" fill="#0a0d0e" opacity=".32"/>
  <g filter="url(#soft)">
    <path d="M168 520 355 190h136l-65 125h141l63-125h137L576 520H440l69-132H367l-67 132Z" fill="url(#ink)" opacity=".92"/>
    <circle cx="786" cy="365" r="150" fill="none" stroke="#ffde59" stroke-width="54" opacity=".9"/>
    <path d="M882 247 1040 510H910L804 330Z" fill="#f7f5eb" opacity=".88"/>
  </g>
  <rect width="1200" height="760" fill="url(#weave)"/>
  <g opacity=".3" fill="#fff">
    <circle cx="301" cy="274" r="4"/><circle cx="366" cy="431" r="3"/><circle cx="522" cy="346" r="4"/><circle cx="690" cy="475" r="3"/><circle cx="841" cy="330" r="4"/><circle cx="930" cy="448" r="3"/>
  </g>
  <rect x="36" y="36" width="1128" height="688" rx="30" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
  <g transform="translate(76 596)">
    <rect width="350" height="86" rx="43" fill="#080a0b" fill-opacity=".78"/>
    <circle cx="47" cy="43" r="13" fill="#ffde59"/>
    <text x="80" y="38" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Färg i fibrerna</text>
    <text x="80" y="64" fill="#c9cecf" font-family="Arial, sans-serif" font-size="18">Mjuk, matt yta</text>
  </g>
</svg>
